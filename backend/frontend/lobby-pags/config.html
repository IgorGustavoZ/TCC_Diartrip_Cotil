<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diartrip</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_back" />
<link rel="stylesheet" href="../static/style.css?v=4">
<link rel="shortcut icon" href="../imagens/favicon-diartrip.png" type="image/x-icon">
<script src="../static/i18n.js"></script>
<script src="../static/confirm-modal.js"></script>
<style>
.config-wrap { max-width: 640px; margin: 0 auto; }
.config-subtitle { color: var(--text-muted); font-size: 14px; margin: -18px 0 26px; }

/* Settings menu row (replaces the old bare button) */
.settings-menu { width: 100%; }
.settings-row {
    display: flex;
    align-items: center;
    gap: 16px;
    width: 100%;
    height: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
    box-shadow: var(--shadow-sm);
    backdrop-filter: blur(14px);
    text-align: left;
    font-family: inherit;
    cursor: pointer;
    transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease;
}
.settings-row:hover, .settings-row:focus-visible {
    border-color: var(--primary);
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
}
.settings-row-icon {
    width: 42px; height: 42px; flex-shrink: 0;
    border-radius: var(--radius-md);
    background: var(--gradient);
    display: flex; align-items: center; justify-content: center;
    font-size: 19px;
}
.settings-row-text { flex: 1; min-width: 0; }
.settings-row-title { display: block; font-size: 15px; font-weight: 600; color: var(--text); }
.settings-row-desc { display: block; font-size: 13px; color: var(--text-muted); margin-top: 2px; }
.settings-row-chevron { color: var(--text-muted); font-size: 22px; flex-shrink: 0; transition: transform .2s ease, color .2s ease; }
.settings-row:hover .settings-row-chevron { transform: translateX(3px); color: var(--primary); }

/* Edit panel */
#alterarConta { animation: fadeSlideIn .25s ease; }
@keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
}

.back-row { display: flex; align-items: center; gap: 10px; }
.back-label { font-size: 14px; font-weight: 600; color: var(--text-secondary); }

.fields-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 620px) {
    .fields-grid { grid-template-columns: 1fr; }
}

/* Alert banners — display toggling stays untouched (still driven by JS via .style.display) */
.error, .sucess {
    padding: 12px 16px;
    border-radius: var(--radius-md);
    font-weight: 600;
    font-size: 13px;
}
.error { background: var(--danger-soft); border: 1px solid rgba(248,113,113,0.3); }
.sucess { background: var(--success-soft); border: 1px solid rgba(74,222,128,0.3); }
.error::before { content: "⚠️  "; }
.sucess::before { content: "✅  "; }

.actions-row {
    margin: 22px 0 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    border-top: 1px solid var(--border);
    padding-top: 20px;
}
.delete-outline {
    background: transparent !important;
    color: var(--danger) !important;
    border: 1px solid rgba(248,113,113,0.35) !important;
    font-weight: 600;
    padding: 10px 18px;
}
.delete-outline:hover { background: var(--danger-soft) !important; }

button.is-loading { opacity: .65; cursor: wait !important; pointer-events: none; }

/* Password section */
.password-input-wrap { position: relative; display: flex; }
.password-input-wrap input { width: 100%; padding-right: 44px; }
.toggle-pass {
    position: absolute;
    right: 4px; top: 50%; transform: translateY(-50%);
    width: 36px; height: 36px !important;
    background: transparent !important;
    border: none !important;
    color: var(--text-muted);
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
}
.toggle-pass:hover { color: var(--text); }
.field-error {
    display: none;
    font-size: 12px;
    color: var(--danger);
    font-weight: 600;
}
.field-error.show { display: block; }
</style>
</head>
<body>
    <div class="app">

    <div class="sidebar">

    <a href="../lobby.html">
        <div class="logo"><img src="../imagens/logo-diartrip.png" alt=""></div>
    </a>

    <a href="../lobby.html">
        <div class="menu-item" data-i18n="nav.myTrips">✈ My Trips</div>
    </a>
    <a href="grupos.html">
        <div class="menu-item" data-i18n="nav.groups">🌍 Groups</div>
    </a>
    <a href="explorar-viagens.html">
        <div class="menu-item" data-i18n="nav.explore">✈️ Explore Trips</div>
    </a>
    <a href="feed.html">
        <div class="menu-item" data-i18n="nav.community">🌎 Feed</div>
    </a>
    <!-- <a href="chat-viagem.html">
        <div class="menu-item" data-i18n="nav.aiChat">💬 AI Chat</div>
    </a> -->
    <!-- <a href="#">
        <div class="menu-item" data-i18n="nav.settings">⚙ Settings</div>
    </a> -->
    <a href="perfil.html">
        <div class="menu-item" data-i18n="nav.profile">👤 Profile</div>
    </a>
    <a href="chat-viagem.html">
        <button class="new-trip" data-i18n="nav.newTrip">+ New Trip</button>
    </a>

    <div class="sidebar-spacer"></div>
    <div class="menu-item menu-item-logout" onclick="performLogout()" data-i18n="nav.logout">Sair</div>

    </div>

    <div class="main">
        <div class="header">
            <h1 data-i18n="config.header">⚙ Settings</h1>
        </div>
        <p class="config-subtitle" data-i18n="config.subtitle">Manage your account information.</p>

        <div class="config-wrap">
            <div class="settings-menu">
                <button id="btnAlterarConta" class="settings-row" type="button">
                    <span class="settings-row-icon">👤</span>
                    <span class="settings-row-text">
                        <span class="settings-row-title" data-i18n="config.changeAccount">Change account information</span>
                        <span class="settings-row-desc" data-i18n="config.changeAccountDesc">Update your name, email or delete your account</span>
                    </span>
                    <span class="settings-row-chevron">›</span>
                </button>
            </div>

            <div class="settings-menu" style="margin-top:12px;">
                <button id="btnAlterarSenha" class="settings-row" type="button">
                    <span class="settings-row-icon">🔒</span>
                    <span class="settings-row-text">
                        <span class="settings-row-title" data-i18n="config.changePassword">Change password</span>
                        <span class="settings-row-desc" data-i18n="config.changePasswordDesc">Update the password used to sign in</span>
                    </span>
                    <span class="settings-row-chevron">›</span>
                </button>
            </div>

            <section style="padding:0; max-width:1200px; margin:50px auto; position: relative; display:flex; flex-direction:column; gap:15px; display: none;" id="alterarConta">
                    <div class="back back-row" aria-label="Voltar" title="Voltar">
                        <span class="material-symbols-outlined">
                        arrow_back
                        </span>
                        <span class="back-label" data-i18n="common.back">Back</span>
                    </div>

                    <h2 data-i18n="config.alterTitle">Change account information</h2>

                    <div class="fields-grid">
                        <div class="field">
                            <label for="nome" data-i18n="config.newName">Novo nome</label>
                            <input id="nome" type="text" data-i18n-placeholder="config.namePlaceholder" placeholder="Seu nome">
                        </div>

                        <div class="field">
                            <label for="email" data-i18n="config.newEmail">Novo email</label>
                            <input id="email" type="email" data-i18n-placeholder="config.emailPlaceholder" placeholder="seu@email.com">
                        </div>
                    </div>

                    <div class="error" style="display: none;"></div>
                    <div class="sucess" style="display: none;"></div>

                    <div class="actions-row">
                        <button class="save" type="submit" data-i18n="config.saveChanges">Salvar alterações</button>
                        <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
                            <button class="delete delete-outline" data-i18n="config.deleteAccount">Excluir conta</button>
                        </div>
                    </div>
            </section>

            <section style="padding:0; max-width:1200px; margin:50px auto; position: relative; display:flex; flex-direction:column; gap:15px; display: none;" id="alterarSenha">
                    <div id="btnVoltarSenha" class="back back-row" aria-label="Voltar" title="Voltar" role="button">
                        <span class="material-symbols-outlined">
                        arrow_back
                        </span>
                        <span class="back-label" data-i18n="common.back">Back</span>
                    </div>

                    <h2 data-i18n="config.changePasswordTitle">Change password</h2>

                    <div class="field">
                        <label for="senhaAtual" data-i18n="config.currentPassword">Senha atual</label>
                        <div class="password-input-wrap">
                            <input id="senhaAtual" type="password" autocomplete="current-password" data-i18n-placeholder="config.currentPasswordPlaceholder" placeholder="Sua senha atual">
                            <button type="button" class="toggle-pass" data-target="senhaAtual" aria-label="Mostrar senha">👁</button>
                        </div>
                        <span class="field-error" id="erroSenhaAtual"></span>
                    </div>

                    <div class="fields-grid">
                        <div class="field">
                            <label for="novaSenha" data-i18n="config.newPassword">Nova senha</label>
                            <div class="password-input-wrap">
                                <input id="novaSenha" type="password" autocomplete="new-password" data-i18n-placeholder="config.newPasswordPlaceholder" placeholder="Mínimo 8 caracteres">
                                <button type="button" class="toggle-pass" data-target="novaSenha" aria-label="Mostrar senha">👁</button>
                            </div>
                            <span class="field-error" id="erroNovaSenha"></span>
                        </div>

                        <div class="field">
                            <label for="confirmarNovaSenha" data-i18n="config.confirmNewPassword">Confirmar nova senha</label>
                            <div class="password-input-wrap">
                                <input id="confirmarNovaSenha" type="password" autocomplete="new-password" data-i18n-placeholder="config.confirmNewPasswordPlaceholder" placeholder="Repita a nova senha">
                                <button type="button" class="toggle-pass" data-target="confirmarNovaSenha" aria-label="Mostrar senha">👁</button>
                            </div>
                            <span class="field-error" id="erroConfirmarNovaSenha"></span>
                        </div>
                    </div>

                    <div class="error" id="erroGeralSenha" style="display: none;"></div>
                    <div class="sucess" id="sucessoSenha" style="display: none;"></div>

                    <div class="actions-row" style="justify-content:flex-start;">
                        <button id="btnSalvarSenha" class="save" type="submit" data-i18n="config.savePassword">Salvar nova senha</button>
                    </div>
            </section>
        </div>
    </div>

    <script>
        const nomeInput = document.querySelector("#nome")
        const emailInput = document.querySelector("#email")
        const btnBack = document.querySelector(".back")
        const btnSave = document.querySelector(".save")
        const btnDelete = document.querySelector(".delete")

        const msgSucess = document.querySelector(".sucess")
        const msgError = document.querySelector(".error")

        const btnAlterarConta = document.querySelector("#btnAlterarConta")
        const divAlterarConta = document.querySelector("#alterarConta")

        btnAlterarConta.addEventListener("click", ()=>{
            btnBack.addEventListener("click", ()=>{
                btnAlterarConta.parentElement.style.display="block"
                divAlterarConta.style.display="none"
            })
            btnAlterarConta.parentElement.style.display="none"
            divAlterarConta.style.display="flex"
        })

        const colocarDados = async ()=>{
           const respGetUsuario = await fetch(`/usuarios/me`, {
                method: 'GET',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include'
           })
            if(respGetUsuario.ok){
                const dados = await respGetUsuario.text()
                const respJson = JSON.parse(dados)
                console.log(dados)
                nomeInput.value = respJson.nome
                emailInput.value = respJson.email
            }
        }

        colocarDados()

        btnSave.addEventListener("click", async ()=>{
            if (!nomeInput.value.trim()) {
                esconderAvisos()
                msgError.style.display = "block"
                msgError.innerHTML = t('config.nameRequired')
                return
            }
            if (!emailInput.value.includes('@')) {
                esconderAvisos()
                msgError.style.display = "block"
                msgError.innerHTML = t('config.emailInvalid')
                return
            }
            btnSave.disabled = true
            btnSave.classList.add("is-loading")
            const textoOriginalSave = btnSave.textContent
            btnSave.textContent = t('config.saving')
            const respPutUsuario = await fetch(`/usuarios/${sessionStorage.getItem("id")}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({
                    nome: nomeInput.value.trim(),
                    email: emailInput.value
                })
            })
            btnSave.disabled = false
            btnSave.classList.remove("is-loading")
            btnSave.textContent = textoOriginalSave
            if(respPutUsuario.ok){
                esconderAvisos()
                msgSucess.style.display = "block"
                msgSucess.innerHTML = t('config.updateSuccess')
                limparCampos()
                colocarDados()
            } else {
                esconderAvisos()
                msgError.style.display = "block"
                msgError.innerHTML = t('config.updateError')
            }
        })

        btnDelete.addEventListener("click", ()=>{
            abrirModalConfirmacao({
                titulo: t('common.confirmDelete'),
                mensagem: t('config.deleteAccountConfirmBody'),
                textoConfirmar: t('config.deleteAccount'),
                tipo: 'perigo',
                onConfirmar: async () => {
                    btnDelete.disabled = true
                    btnDelete.classList.add("is-loading")
                    const textoOriginalDelete = btnDelete.textContent
                    btnDelete.textContent = t('config.deleting')
                    const respDeleteUsuario = await fetch(`/usuarios/${sessionStorage.getItem("id")}`, {
                        method: 'DELETE',
                        credentials: 'include'
                    })
                    if(respDeleteUsuario.ok){
                        esconderAvisos()
                        msgSucess.style.display = "block"
                        msgSucess.innerHTML = t('config.deleteSuccess')
                        await fetch('/logout', { method: 'POST', credentials: 'include' })
                        setTimeout(()=>{ window.location.href = "../index.html" }, 2000)
                    } else {
                        btnDelete.disabled = false
                        btnDelete.classList.remove("is-loading")
                        btnDelete.textContent = textoOriginalDelete
                        esconderAvisos()
                        msgError.style.display = "block"
                        msgError.innerHTML = t('config.deleteError')
                    }
                }
            })
        })

        const esconderAvisos = ()=>{
            msgError.style.display = "none"
            msgSucess.style.display = "none"
        }

        const limparCampos = ()=>{
            nomeInput.value = ""
            emailInput.value = ""
        }

        // ===================== Alterar senha (seção independente) =====================
        const btnAlterarSenha = document.querySelector("#btnAlterarSenha")
        const divAlterarSenha = document.querySelector("#alterarSenha")
        const btnVoltarSenha = document.querySelector("#btnVoltarSenha")

        const senhaAtualInput = document.querySelector("#senhaAtual")
        const novaSenhaInput = document.querySelector("#novaSenha")
        const confirmarNovaSenhaInput = document.querySelector("#confirmarNovaSenha")

        const erroSenhaAtualEl = document.querySelector("#erroSenhaAtual")
        const erroNovaSenhaEl = document.querySelector("#erroNovaSenha")
        const erroConfirmarNovaSenhaEl = document.querySelector("#erroConfirmarNovaSenha")
        const erroGeralSenhaEl = document.querySelector("#erroGeralSenha")
        const sucessoSenhaEl = document.querySelector("#sucessoSenha")
        const btnSalvarSenha = document.querySelector("#btnSalvarSenha")

        btnAlterarSenha.addEventListener("click", ()=>{
            btnVoltarSenha.addEventListener("click", ()=>{
                btnAlterarSenha.parentElement.style.display = "block"
                divAlterarSenha.style.display = "none"
            })
            btnAlterarSenha.parentElement.style.display = "none"
            divAlterarSenha.style.display = "flex"
        })

        document.querySelectorAll("#alterarSenha .toggle-pass").forEach(btn => {
            btn.addEventListener("click", () => {
                const alvo = document.getElementById(btn.dataset.target)
                if (!alvo) return
                const vaiMostrar = alvo.type === "password"
                alvo.type = vaiMostrar ? "text" : "password"
                btn.textContent = vaiMostrar ? "🙈" : "👁"
                btn.setAttribute("aria-label", t(vaiMostrar ? 'config.hidePassword' : 'config.showPassword'))
            })
        })

        function esconderErrosSenha() {
            [erroSenhaAtualEl, erroNovaSenhaEl, erroConfirmarNovaSenhaEl].forEach(el => {
                el.textContent = ""
                el.classList.remove("show")
            })
            erroGeralSenhaEl.style.display = "none"
            sucessoSenhaEl.style.display = "none"
        }

        function mostrarErroCampoSenha(el, msg) {
            el.textContent = msg
            el.classList.add("show")
        }

        // Normaliza tanto {"detail": "mensagem"} quanto o formato de erro de
        // validação do FastAPI/Pydantic {"detail": [{"msg": "..."}]}.
        function extrairMensagemErro(corpoResposta, fallback) {
            const detail = corpoResposta && corpoResposta.detail
            if (!detail) return fallback
            if (Array.isArray(detail)) return detail[0]?.msg || fallback
            return detail
        }

        function validarCamposSenha() {
            const senhaAtual = senhaAtualInput.value
            const novaSenha = novaSenhaInput.value
            const confirmarNovaSenha = confirmarNovaSenhaInput.value
            let valido = true

            if (!senhaAtual.trim()) {
                mostrarErroCampoSenha(erroSenhaAtualEl, t('config.currentPasswordRequired'))
                valido = false
            }

            if (!novaSenha.trim()) {
                mostrarErroCampoSenha(erroNovaSenhaEl, t('config.newPasswordRequired'))
                valido = false
            } else if (novaSenha.length < 8) {
                mostrarErroCampoSenha(erroNovaSenhaEl, t('config.newPasswordTooShort'))
                valido = false
            } else if (!/[A-Z]/.test(novaSenha) || !/[0-9]/.test(novaSenha)) {
                mostrarErroCampoSenha(erroNovaSenhaEl, t('config.newPasswordWeak'))
                valido = false
            } else if (senhaAtual && novaSenha === senhaAtual) {
                mostrarErroCampoSenha(erroNovaSenhaEl, t('config.newPasswordSameAsCurrent'))
                valido = false
            }

            if (!confirmarNovaSenha.trim()) {
                mostrarErroCampoSenha(erroConfirmarNovaSenhaEl, t('config.confirmPasswordRequired'))
                valido = false
            } else if (novaSenha && confirmarNovaSenha !== novaSenha) {
                mostrarErroCampoSenha(erroConfirmarNovaSenhaEl, t('config.passwordsDontMatch'))
                valido = false
            }

            return valido
        }

        const limparCamposSenha = ()=>{
            senhaAtualInput.value = ""
            novaSenhaInput.value = ""
            confirmarNovaSenhaInput.value = ""
            document.querySelectorAll("#alterarSenha .toggle-pass").forEach(btn => {
                const alvo = document.getElementById(btn.dataset.target)
                if (alvo) alvo.type = "password"
                btn.textContent = "👁"
            })
        }

        btnSalvarSenha.addEventListener("click", async ()=>{
            esconderErrosSenha()
            if (!validarCamposSenha()) return

            btnSalvarSenha.disabled = true
            btnSalvarSenha.classList.add("is-loading")
            const textoOriginalSalvarSenha = btnSalvarSenha.textContent
            btnSalvarSenha.textContent = t('config.saving')

            try {
                const resp = await fetch(`/usuarios/${sessionStorage.getItem("id")}/senha`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        senha_atual: senhaAtualInput.value,
                        nova_senha: novaSenhaInput.value
                    })
                })

                if (resp.ok) {
                    limparCamposSenha()
                    sucessoSenhaEl.style.display = "block"
                    sucessoSenhaEl.innerHTML = t('config.passwordUpdateSuccess')
                } else {
                    const corpo = await resp.json().catch(() => ({}))
                    if (resp.status === 401) {
                        mostrarErroCampoSenha(
                            erroSenhaAtualEl,
                            extrairMensagemErro(corpo, t('config.currentPasswordIncorrect'))
                        )
                    } else {
                        erroGeralSenhaEl.style.display = "block"
                        erroGeralSenhaEl.innerHTML = extrairMensagemErro(corpo, t('config.passwordUpdateError'))
                    }
                }
            } catch (e) {
                erroGeralSenhaEl.style.display = "block"
                erroGeralSenhaEl.innerHTML = t('lobby.chat.noServer')
            } finally {
                btnSalvarSenha.disabled = false
                btnSalvarSenha.classList.remove("is-loading")
                btnSalvarSenha.textContent = textoOriginalSalvarSenha
            }
        })
    </script>
</body>
