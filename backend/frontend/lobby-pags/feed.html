<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diartrip - Explorar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../static/style.css?v=5">
<link rel="shortcut icon" href="../imagens/favicon-diartrip.png" type="image/x-icon">
<script src="../static/i18n.js"></script>
<script src="../static/confirm-modal.js"></script>
<style>
.post-acoes {
    display: flex; gap: 8px; margin-top: 10px;
}
.btn-curtir, .btn-comentar {
    display: flex; align-items: center; gap: 5px;
    background: none; border: 1px solid var(--border); border-radius: 20px;
    color: var(--text-muted); font-size: 13px; padding: 5px 12px !important; height: auto !important;
    cursor: pointer; font-family: inherit; transition: background 0.2s, border-color 0.2s;
}
.btn-curtir:hover, .btn-comentar:hover {
    background: var(--surface-2); border-color: var(--border-strong);
}
.btn-curtir.curtido { color: var(--danger); border-color: rgba(var(--danger-rgb),0.35); }
.btn-curtir:disabled { opacity: 0.6; cursor: not-allowed; }

.feed-comentarios { margin-top: 10px; }
.feed-coments-lista { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
.feed-coment { display: flex; gap: 8px; align-items: flex-start; }
.feed-cav {
    width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; overflow: hidden;
    background: var(--gradient);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; color: #fff;
}
.feed-cav img { width: 100%; height: 100%; object-fit: cover; }
.feed-ctxt { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
.feed-cnome { font-weight: 700; color: var(--text); margin-right: 4px; }
.feed-coment-input {
    display: flex; gap: 6px; align-items: flex-end; margin-top: 4px;
}
.feed-coment-input input {
    flex: 1; padding: 8px 14px; border-radius: 20px;
    border: 1px solid var(--border); background: var(--surface-2);
    color: var(--text); font-size: 13px; font-family: inherit;
    transition: border 0.2s;
}
.feed-coment-input input:focus { outline: none; border-color: var(--primary); background: var(--surface); }
.feed-coment-input button {
    background: none; border: none; padding: 0 4px !important; height: auto !important;
    color: var(--primary); font-size: 13px; font-weight: 600; cursor: pointer;
    flex-shrink: 0; white-space: nowrap;
}
.feed-coment-input button:hover { color: var(--accent); }

/* Post-referência (compartilhou uma viagem/roteiro) — um cartão dentro do
   post, com os dados ATUAIS do que foi compartilhado (a API já entrega isso
   pronto em ref_grupo/ref_roteiro; nunca é texto copiado no momento do
   compartilhamento). */
.post-ref-selo { font-size: 12px; color: var(--text-muted); margin: 0 0 8px; }
.post-ref-card {
    border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;
    background: var(--surface-2); margin-top: 8px;
}
.post-ref-titulo { font-size: 15px; font-weight: 700; color: var(--text); margin: 0 0 4px; }
.post-ref-sub { font-size: 12px; color: var(--text-muted); margin: 0 0 8px; }
.post-ref-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--text-secondary); }
.post-ref-desc { font-size: 13px; color: var(--text-secondary); white-space: pre-wrap; line-height: 1.5; margin-top: 6px; }
.post-ref-item { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
.post-ref-btn {
    display: inline-block; margin-top: 10px; background: var(--gradient); color: #fff;
    border: none; border-radius: 8px; padding: 8px 16px; font-size: 13px; font-weight: 600;
    cursor: pointer; text-decoration: none;
}

/* Comunidades */
.explorar-wrap { max-width: 720px; margin: 0 auto; }
.busca-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px; margin-bottom: 24px; box-shadow: var(--shadow-sm); backdrop-filter: blur(14px);
    display: flex; flex-direction: column; gap: 12px;
}
.busca-row { display: flex; gap: 10px; }
.busca-row input {
    flex: 1; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px; color: var(--text); font-size: 15px; outline: none;
}
.busca-row input:focus { border-color: var(--primary); background: var(--surface); }
.btn-buscar {
    background: var(--gradient); color: #fff; border: none; border-radius: 8px; padding: 10px 20px;
    font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
}
.btn-buscar:hover { opacity: 0.9; }
.btn-nova-comunidade {
    align-self: flex-start; background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
}
.btn-nova-comunidade:hover { background: var(--surface); }

/* Criar comunidade — modal dedicado (mesmo overlay/cartão do seletor de
   compartilhamento, .confirm-modal-ov/.confirm-modal), com hierarquia clara
   em vez de um formulário de cadastro genérico. */
.criar-comunidade-modal { max-width: 460px; text-align: left; max-height: 85vh; overflow-y: auto; }
.criar-comunidade-sub { font-size: 13px; color: var(--text-muted); margin: 0 0 20px; line-height: 1.5; }

.criar-comunidade-foto-row { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
.criar-comunidade-foto-av {
    width: 64px; height: 64px; border-radius: 50%; flex-shrink: 0; overflow: hidden;
    background: var(--surface-2); border: 1px dashed var(--border-strong);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; color: var(--text-muted);
}
.criar-comunidade-foto-av img { width: 100%; height: 100%; object-fit: cover; }
.criar-comunidade-foto-av.tem-foto { border-style: solid; }
.signup-foto-btn {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 16px; font-size: 13px; font-weight: 600; color: var(--text); cursor: pointer;
}
.signup-foto-btn:hover { background: var(--surface); }

.form-comunidade-campo { margin-bottom: 16px; }
.form-comunidade-campo > label {
    display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px;
}
.form-comunidade-campo input, .form-comunidade-campo textarea {
    width: 100%; box-sizing: border-box; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; color: var(--text); font-size: 14px; outline: none;
    font-family: inherit; transition: border-color 0.2s;
}
.form-comunidade-campo input:focus, .form-comunidade-campo textarea:focus { border-color: var(--primary); background: var(--surface); }
.form-comunidade-campo textarea { resize: vertical; min-height: 64px; }

.privacidade-opcoes { display: flex; flex-direction: column; gap: 8px; }
.privacidade-card {
    border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
}
.privacidade-card:hover { background: var(--surface-2); }
.privacidade-card.selecionada { border-color: var(--primary); background: var(--primary-soft); }
.privacidade-card-titulo { font-size: 14px; font-weight: 700; color: var(--text); margin: 0 0 2px; }
.privacidade-card-desc { font-size: 12px; color: var(--text-muted); margin: 0; }

.criar-comunidade-submit { width: 100%; margin-top: 8px; }

.comunidade-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px 20px; margin-bottom: 14px; box-shadow: var(--shadow-sm); backdrop-filter: blur(14px);
}
.comunidade-nome { font-size: 16px; font-weight: 700; color: var(--text); margin: 0 0 4px; cursor: pointer; }
.comunidade-nome:hover { text-decoration: underline; }
.comunidade-meta { font-size: 12px; color: var(--text-muted); margin: 0 0 8px; }
.comunidade-desc { font-size: 13px; color: var(--text-secondary); margin: 0 0 12px; }
.explorar-vazio { color: var(--text-muted); font-size: 14px; text-align: center; padding: 40px 0; }

/* Seletor de "compartilhar viagem/roteiro" no composer — reaproveita o
   overlay/cartão do modal de confirmação genérico (.confirm-modal-ov /
   .confirm-modal), só ajustando largura e alinhamento pro conteúdo próprio. */
.seletor-modal { max-width: 480px; text-align: left; max-height: 80vh; overflow-y: auto; }
.seletor-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.seletor-fechar {
    background: none; border: none; color: var(--text-muted); font-size: 16px;
    cursor: pointer; padding: 4px;
}
.seletor-fechar:hover { color: var(--text); }
.seletor-item {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 10px; cursor: pointer; transition: border-color 0.2s;
}
.seletor-item:hover { border-color: var(--primary); }
.seletor-item-nome { font-size: 14px; font-weight: 700; color: var(--text); margin: 0 0 4px; }
.seletor-item-meta { font-size: 12px; color: var(--text-muted); }
.seletor-vazio { color: var(--text-muted); font-size: 13px; text-align: center; padding: 20px 0; }
.seletor-select {
    width: 100%; box-sizing: border-box; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 12px; color: var(--text); font-size: 14px; outline: none; margin-bottom: 14px;
}

/* Preview da viagem/roteiro escolhido, dentro do próprio composer, antes de publicar */
.ref-preview {
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
    background: var(--surface-2); margin-top: 8px; display: flex; align-items: center; gap: 10px;
}
.ref-preview-info { flex: 1; min-width: 0; }
.ref-preview-titulo { font-size: 13px; font-weight: 700; color: var(--text); margin: 0; }
.ref-preview-sub { font-size: 12px; color: var(--text-muted); margin: 0; }
.ref-preview-rm {
    background: none; border: none; color: var(--text-muted); font-size: 15px; cursor: pointer; flex-shrink: 0;
}
.ref-preview-rm:hover { color: var(--danger); }
</style>
</head>
<body>
<div class="app">

    <div class="sidebar">
        <a href="../lobby.html">
            <div class="logo"><img src="../imagens/logo-diartrip.png" alt=""></div>
        </a>
        <a href="../lobby.html">
            <div class="menu-item" data-i18n="nav.myTrips">✈ My Trips</div>
        </a>
        <a href="grupos.html">
            <div class="menu-item" data-i18n="nav.groups">🌍 Groups</div>
        </a>
        <a href="explorar-viagens.html">
            <div class="menu-item" data-i18n="nav.explore">✈️ Explore Trips</div>
        </a>
        <a href="feed.html">
            <div class="menu-item" data-i18n="nav.community">🌎 Feed</div>
        </a>
        <a href="perfil.html">
            <div class="menu-item" data-i18n="nav.profile">👤 Profile</div>
        </a>
        <!-- <a href="chat-viagem.html">
            <div class="menu-item" data-i18n="nav.aiChat">💬 AI Chat</div>
        </a> -->
        <a href="chat-viagem.html">
            <button class="new-trip" data-i18n="nav.newTrip">+ New Trip</button>
        </a>
        <div class="sidebar-spacer"></div>
        <div class="menu-item menu-item-logout" onclick="performLogout()" data-i18n="nav.logout">Sair</div>
    </div>

    <div class="main">
        <div class="header">
            <h2 data-i18n="explorar.tabsHeader">Explorar</h2>
            <a href="perfil.html" id="userChip" style="display:flex;align-items:center;background:var(--surface-2);border:1px solid var(--border);padding:4px;border-radius:50%;cursor:pointer;transition:background 0.2s;text-decoration:none;color:inherit;">
                <div id="avatarMini" style="width:36px;height:36px;border-radius:50%;background:var(--gradient);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0;">?</div>
            </a>
        </div>
        <div class="tabs-nav">
            <button class="tab-btn active" onclick="switchTabExplorar(this, 'publicacoes')" data-i18n="explorar.tab.posts">📰 Publicações</button>
            <button class="tab-btn" onclick="switchTabExplorar(this, 'comunidades')" data-i18n="explorar.tab.comunidades">👥 Comunidades</button>
        </div>

        <div id="tabExplorar-publicacoes" class="tab-content active">
            <div class="feed-wrap">

                <div class="create-card">
                    <div class="av" id="avCreate">?</div>
                    <div class="create-right">
                        <textarea id="postTexto" data-i18n-placeholder="feed.placeholder" placeholder="Share something about your trip..."></textarea>
                        <div class="img-preview-wrap" id="imgPreviewWrap">
                            <img id="imgPreview" src="" alt="">
                            <button class="btn-rm-img" onclick="removerImagem()">✕</button>
                        </div>
                        <div id="refPreviewWrap"></div>
                        <div class="create-actions">
                            <div style="display:flex; gap:6px; flex-wrap:wrap;">
                                <label class="btn-foto-post">
                                    <span data-i18n="feed.photo">📷 Foto</span>
                                    <input type="file" id="postFotoInput" accept="image/jpeg,image/png,image/webp" style="display:none">
                                </label>
                                <button type="button" class="btn-foto-post" onclick="abrirSeletorViagem()" data-i18n="feed.shareTrip">🧳 Viagem</button>
                                <button type="button" class="btn-foto-post" onclick="abrirSeletorRoteiro()" data-i18n="feed.shareItinerary">📍 Roteiro</button>
                            </div>
                            <button class="btn-publicar" id="btnPublicar" onclick="publicar()" data-i18n="feed.publish">Publicar</button>
                        </div>
                    </div>
                </div>

                <div id="feedLista"></div>

            </div>
        </div>

        <div id="tabExplorar-comunidades" class="tab-content">
            <div class="explorar-wrap">
                <div class="busca-card">
                    <div class="busca-row">
                        <input id="comunidadeBuscaInput" data-i18n-placeholder="comunidades.searchPlaceholder" placeholder="🔎 Search communities...">
                        <button class="btn-buscar" onclick="carregarComunidades()" data-i18n="explorar.searchBtn">Search</button>
                    </div>
                    <button class="btn-nova-comunidade" onclick="abrirModalCriarComunidade()" data-i18n="comunidades.newBtn">+ Criar comunidade</button>
                </div>

            </div>
        </div>

</div>

<div class="confirm-modal-ov" id="modalCriarComunidadeOv" onclick="if(event.target===this) fecharModalCriarComunidade()">
    <div class="confirm-modal criar-comunidade-modal">
        <div class="seletor-header">
            <h3 style="margin:0;" data-i18n="comunidades.form.title">Create community</h3>
            <button type="button" class="seletor-fechar" onclick="fecharModalCriarComunidade()">✕</button>
        </div>
        <p class="criar-comunidade-sub" data-i18n="comunidades.form.subtitle">Create a space for people who share the same travel interests.</p>

        <div class="criar-comunidade-foto-row">
            <div class="criar-comunidade-foto-av" id="comunidadeFotoAv">+</div>
            <label class="signup-foto-btn">
                <span id="comunidadeFotoBtnTexto" data-i18n="register.photo.add">Add photo</span>
                <input type="file" id="comunidadeFotoInput" accept="image/jpeg,image/png,image/webp" style="display:none">
            </label>
        </div>

        <div class="form-comunidade-campo">
            <label data-i18n="comunidades.form.name">Name</label>
            <input id="comunidadeNome" maxlength="150" data-i18n-placeholder="comunidades.form.namePlaceholder" placeholder="e.g. Japan Lovers">
        </div>

        <div class="form-comunidade-campo">
            <label data-i18n="comunidades.form.aboutLabel">About the community</label>
            <textarea id="comunidadeDescricao" maxlength="2000" data-i18n-placeholder="comunidades.form.desc" placeholder="Description"></textarea>
        </div>

        <div class="form-comunidade-campo">
            <label data-i18n="comunidades.form.themeLabel">Theme / destination</label>
            <input id="comunidadeCategoria" maxlength="100" data-i18n-placeholder="comunidades.form.category" placeholder="Category/destination (e.g. Japan, Backpacking)">
        </div>

        <div class="form-comunidade-campo">
            <label data-i18n="comunidades.form.privacyLabel">Privacy</label>
            <div class="privacidade-opcoes">
                <div class="privacidade-card selecionada" id="privCardPublica" onclick="selecionarPrivacidade('publica')">
                    <p class="privacidade-card-titulo">🌎 <span data-i18n="comunidades.form.public">Public</span></p>
                    <p class="privacidade-card-desc" data-i18n="comunidades.form.publicDesc">Anyone can find and join.</p>
                </div>
                <div class="privacidade-card" id="privCardPrivada" onclick="selecionarPrivacidade('privada')">
                    <p class="privacidade-card-titulo">🔒 <span data-i18n="comunidades.form.private">Private</span></p>
                    <p class="privacidade-card-desc" data-i18n="comunidades.form.privateDesc">Only people with an invite code can join.</p>
                </div>
            </div>
        </div>

        <span class="msg" id="comunidadeFormErro" style="display:none; color:var(--danger); font-size:13px;"></span>
        <button class="btn-publicar criar-comunidade-submit" id="btnCriarComunidade" onclick="criarComunidade()" data-i18n="comunidades.form.submit">Create community</button>
    </div>
</div>

<!-- Modal de seleção (compartilhar viagem/roteiro) — mesmo visual do modal
     de confirmação genérico (.confirm-modal-ov/.confirm-modal em style.css),
     só que com conteúdo próprio em vez de sim/não. -->
<div class="confirm-modal-ov" id="seletorOv" onclick="if(event.target===this) fecharSeletor()">
    <div class="confirm-modal seletor-modal">
        <div class="seletor-header">
            <h3 id="seletorTitulo" style="margin:0;"></h3>
            <button type="button" class="seletor-fechar" onclick="fecharSeletor()">✕</button>
        </div>
        <div id="seletorCorpo"></div>
    </div>
</div>

<script>
const meuId = parseInt(sessionStorage.getItem("id"))
if (!sessionStorage.getItem("logado")) window.location.href = "../login.html"

document.addEventListener('languageChanged', () => {
    applyTranslations()
    if (_abaExplorarAtiva === 'publicacoes') carregarFeed()
    else carregarComunidades()
})

// ── Abas: Publicações (feed baseado em compartilhamento) / Comunidades ──
// "Viagens públicas" NÃO tem uma segunda listagem aqui — quem cuida disso é
// explorar-viagens.html, como sempre foi. O Feed só mostra o que alguém
// decidiu compartilhar (texto, ou uma referência a uma viagem/roteiro).
let _abaExplorarAtiva = 'publicacoes'
const _abasExplorarCarregadas = new Set(['publicacoes'])

function switchTabExplorar(btn, aba) {
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'))
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'))
    document.getElementById(`tabExplorar-${aba}`).classList.add('active')
    btn.classList.add('active')
    _abaExplorarAtiva = aba

    if (_abasExplorarCarregadas.has(aba)) return
    _abasExplorarCarregadas.add(aba)
    if (aba === 'comunidades') carregarComunidades()
}

document.getElementById("comunidadeBuscaInput")?.addEventListener("keydown", e => {
    if (e.key === "Enter") carregarComunidades()
})

// ── Criar comunidade (modal) ──
let _comunidadePrivacidade = 'publica'
let _comunidadeFotoSelecionada = null

function abrirModalCriarComunidade() {
    document.getElementById("modalCriarComunidadeOv").classList.add("ativo")
}

function fecharModalCriarComunidade() {
    document.getElementById("modalCriarComunidadeOv").classList.remove("ativo")
}

function selecionarPrivacidade(valor) {
    _comunidadePrivacidade = valor
    document.getElementById("privCardPublica").classList.toggle("selecionada", valor === 'publica')
    document.getElementById("privCardPrivada").classList.toggle("selecionada", valor === 'privada')
}

document.getElementById("comunidadeFotoInput").addEventListener("change", (e) => {
    const file = e.target.files[0]
    if (!file) return
    _comunidadeFotoSelecionada = file
    const av = document.getElementById("comunidadeFotoAv")
    av.classList.add("tem-foto")
    av.innerHTML = `<img src="${URL.createObjectURL(file)}" alt="">`
    document.getElementById("comunidadeFotoBtnTexto").textContent = t("register.photo.change")
})

async function criarComunidade() {
    const nome = document.getElementById("comunidadeNome").value.trim()
    const descricao = document.getElementById("comunidadeDescricao").value.trim()
    const categoria = document.getElementById("comunidadeCategoria").value.trim()
    const erro = document.getElementById("comunidadeFormErro")
    const btn = document.getElementById("btnCriarComunidade")
    erro.style.display = "none"

    if (nome.length < 3) {
        erro.textContent = t('comunidades.form.nameError')
        erro.style.display = "inline"
        return
    }

    btn.disabled = true
    try {
        const resp = await fetch("/comunidades", {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ nome, descricao, categoria, privacidade: _comunidadePrivacidade })
        })
        const dados = await resp.json()
        if (!resp.ok) {
            erro.textContent = dados.detail || t('comunidades.form.error')
            erro.style.display = "inline"
            return
        }

        // A criação é só JSON (sem foto) — igual ao cadastro de usuário, se
        // uma foto foi escolhida o upload acontece logo depois, reaproveitando
        // o mesmo PATCH /comunidades/{id}/foto já usado na página da comunidade.
        if (_comunidadeFotoSelecionada) {
            const fotoForm = new FormData()
            fotoForm.append("foto", _comunidadeFotoSelecionada)
            try {
                await fetch(`/comunidades/${dados.id_comunidade}/foto`, {
                    method: "PATCH", credentials: "include", body: fotoForm
                })
            } catch (e) { /* comunidade já foi criada; foto pode ser definida depois */ }
        }

        window.location.href = `comunidade.html?id=${dados.id_comunidade}`
    } catch (e) {
        erro.textContent = t('comunidades.form.error')
        erro.style.display = "inline"
    } finally {
        btn.disabled = false
    }
}

async function carregarComunidades() {
    const busca = document.getElementById("comunidadeBuscaInput").value.trim()
    const url = busca ? `/comunidades?busca=${encodeURIComponent(busca)}` : "/comunidades"
    const resp = await fetch(url, { credentials: "include" })
    if (!resp.ok) return

    const comunidades = await resp.json()
    const lista = document.getElementById("comunidadesLista")

    if (comunidades.length === 0) {
        lista.innerHTML = `<p class="explorar-vazio">${t('comunidades.empty')}</p>`
        return
    }

    lista.innerHTML = comunidades.map(c => {
        const iniciais = c.nome.trim().split(" ").map(p => p[0]).slice(0, 2).join("").toUpperCase()
        const avatar = c.foto_capa
            ? `<div class="av" style="width:48px;height:48px;font-size:18px;"><img src="${c.foto_capa}"></div>`
            : `<div class="av" style="width:48px;height:48px;font-size:18px;">${iniciais || "👥"}</div>`
        return `
        <div class="comunidade-card" style="display:flex; gap:14px;">
            ${avatar}
            <div style="flex:1; min-width:0;">
                <p class="comunidade-nome" onclick="window.location.href='comunidade.html?id=${c.id_comunidade}'">
                    ${c.privacidade === 'privada' ? '🔒' : ''} ${escapeHtml(c.nome)}
                </p>
                <p class="comunidade-meta">
                    ${c.total_membros} ${t('comunidades.members')}${c.categoria ? ` · ${escapeHtml(c.categoria)}` : ''}
                    ${c.sou_membro ? ` · ${t('comunidades.youAreMember')}` : ''}
                </p>
                ${c.descricao ? `<p class="comunidade-desc">${escapeHtml(c.descricao)}</p>` : ''}
                <button class="post-ref-btn" onclick="window.location.href='comunidade.html?id=${c.id_comunidade}'">${t('comunidades.viewBtn')}</button>
            </div>
        </div>
    `}).join("")
}

let arquivoSelecionado = null

async function carregarMeu() {
    const resp = await fetch("/usuarios/me", {
        credentials: "include"
    })
    if (!resp.ok) return
    const u = await resp.json()

    const el = document.getElementById("avCreate")
    if (u.foto_perfil) {
        el.innerHTML = `<img src="${u.foto_perfil}">`
    } else {
        el.textContent = u.nome.trim().split(" ").map(p => p[0]).slice(0, 2).join("").toUpperCase()
    }

    const avatarEl = document.getElementById("avatarMini")
    if (u.foto_perfil) {
        avatarEl.innerHTML = `<img src="${u.foto_perfil}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;display:block;">`
    } else {
        avatarEl.textContent = u.nome.trim().split(" ").map(p => p[0]).slice(0, 2).join("").toUpperCase()
    }
}

document.getElementById("postFotoInput").addEventListener("change", (e) => {
    const file = e.target.files[0]
    if (!file) return
    arquivoSelecionado = file
    const url = URL.createObjectURL(file)
    document.getElementById("imgPreview").src = url
    document.getElementById("imgPreviewWrap").style.display = "block"
})

function removerImagem() {
    arquivoSelecionado = null
    document.getElementById("postFotoInput").value = ""
    document.getElementById("imgPreview").src = ""
    document.getElementById("imgPreviewWrap").style.display = "none"
}

// ── Compartilhar viagem/roteiro no composer ──
// Reaproveita POST /posts (tipo/ref_id_grupo/ref_id_roteiro), que já existia
// no backend — só faltava um jeito de chegar nele pela interface, em vez de
// escondido dentro da tela da viagem. GET /grupos/compartilhaveis (admin +
// viagem pública) alimenta o seletor de viagem; GET /grupos/administradas
// (qualquer privacidade) + GET /grupos/{id}/roteiros alimentam o de roteiro
// — roteiro não exige a viagem ser pública, porque o conteúdo já vai
// embutido na publicação.
let _refSelecionada = null // { tipo, ref_id_grupo?, ref_id_roteiro?, titulo, sub }

function abrirSeletor(titulo) {
    document.getElementById("seletorTitulo").textContent = titulo
    document.getElementById("seletorOv").classList.add("ativo")
}

function fecharSeletor() {
    document.getElementById("seletorOv").classList.remove("ativo")
}

async function abrirSeletorViagem() {
    abrirSeletor(t('feed.shareTrip.pickerTitle'))
    const corpo = document.getElementById("seletorCorpo")
    corpo.innerHTML = `<p class="seletor-vazio">${t('common.loading')}</p>`

    const resp = await fetch("/grupos/compartilhaveis", { credentials: "include" })
    if (!resp.ok) { corpo.innerHTML = `<p class="seletor-vazio">${t('feed.shareTrip.pickerError')}</p>`; return }
    const viagens = await resp.json()

    if (viagens.length === 0) {
        corpo.innerHTML = `<p class="seletor-vazio">${t('feed.shareTrip.pickerEmpty')}</p>`
        return
    }

    corpo.innerHTML = viagens.map((v, i) => {
        const periodo = (v.data_inicio && v.data_fim) ? `${v.data_inicio} → ${v.data_fim}` : ""
        return `
        <div class="seletor-item" onclick="selecionarViagem(${i})">
            <p class="seletor-item-nome">🧳 ${escapeHtml(v.nome_grupo)}</p>
            <p class="seletor-item-meta">${v.destino_principal ? escapeHtml(v.destino_principal) + " · " : ""}${periodo}${v.limite_participantes != null ? ` · ${v.vagas_ocupadas}/${v.limite_participantes}` : ""}</p>
        </div>`
    }).join("")
    window._viagensSelecionaveis = viagens
}

function selecionarViagem(indice) {
    const v = window._viagensSelecionaveis[indice]
    const periodo = (v.data_inicio && v.data_fim) ? `${v.data_inicio} → ${v.data_fim}` : ""
    _refSelecionada = {
        tipo: "viagem", ref_id_grupo: v.id_grupo,
        titulo: v.nome_grupo, sub: [v.destino_principal, periodo].filter(Boolean).join(" · "),
    }
    renderRefPreview()
    fecharSeletor()
}

// A unidade de compartilhamento é o ROTEIRO COMPLETO da viagem — não um dia
// nem um item isolado. Não existe um "id de roteiro" separado: o conjunto de
// itens de uma viagem já É o roteiro dela, então 1 clique na viagem já
// seleciona o roteiro inteiro (sem uma segunda etapa de escolher item).
async function abrirSeletorRoteiro() {
    abrirSeletor(t('feed.shareItinerary.pickerTitle'))
    const corpo = document.getElementById("seletorCorpo")
    corpo.innerHTML = `<p class="seletor-vazio">${t('common.loading')}</p>`

    const resp = await fetch("/grupos/administradas", { credentials: "include" })
    if (!resp.ok) { corpo.innerHTML = `<p class="seletor-vazio">${t('feed.shareTrip.pickerError')}</p>`; return }
    const viagens = (await resp.json()).filter(v => v.total_itens_roteiro > 0)

    if (viagens.length === 0) {
        corpo.innerHTML = `<p class="seletor-vazio">${t('feed.shareItinerary.pickerEmpty')}</p>`
        return
    }

    corpo.innerHTML = viagens.map((v, i) => `
        <div class="seletor-item" onclick="selecionarRoteiro(${i})">
            <p class="seletor-item-nome">📍 ${escapeHtml(v.nome_grupo)}</p>
            <p class="seletor-item-meta">${v.destino_principal ? escapeHtml(v.destino_principal) + " · " : ""}${v.total_itens_roteiro} ${t('feed.shareItinerary.items')}</p>
        </div>
    `).join("")
    window._viagensRoteiro = viagens
}

function selecionarRoteiro(indice) {
    const v = window._viagensRoteiro[indice]
    _refSelecionada = {
        tipo: "roteiro", ref_id_grupo: v.id_grupo,
        titulo: v.nome_grupo, sub: `${v.total_itens_roteiro} ${t('feed.shareItinerary.items')}`,
    }
    renderRefPreview()
    fecharSeletor()
}

function removerReferencia() {
    _refSelecionada = null
    renderRefPreview()
}

function renderRefPreview() {
    const wrap = document.getElementById("refPreviewWrap")
    if (!_refSelecionada) { wrap.innerHTML = ""; return }
    const emoji = _refSelecionada.tipo === "viagem" ? "🧳" : "📍"
    wrap.innerHTML = `
        <div class="ref-preview">
            <div class="ref-preview-info">
                <p class="ref-preview-titulo">${emoji} ${escapeHtml(_refSelecionada.titulo)}</p>
                ${_refSelecionada.sub ? `<p class="ref-preview-sub">${escapeHtml(_refSelecionada.sub)}</p>` : ""}
            </div>
            <button type="button" class="ref-preview-rm" onclick="removerReferencia()">✕</button>
        </div>
    `
}

async function publicar() {
    const texto = document.getElementById("postTexto").value.trim()
    if (!texto && !arquivoSelecionado && !_refSelecionada) return

    const btn = document.getElementById("btnPublicar")
    btn.disabled = true

    const form = new FormData()
    form.append("conteudo", texto)
    if (arquivoSelecionado) form.append("imagem", arquivoSelecionado)
    if (_refSelecionada) {
        form.append("tipo", _refSelecionada.tipo)
        if (_refSelecionada.ref_id_grupo) form.append("ref_id_grupo", _refSelecionada.ref_id_grupo)
        if (_refSelecionada.ref_id_roteiro) form.append("ref_id_roteiro", _refSelecionada.ref_id_roteiro)
    }

    try {
        const resp = await fetch("/posts", {
            method: "POST",
            credentials: "include",
            body: form
        })
        if (resp.ok) {
            document.getElementById("postTexto").value = ""
            removerImagem()
            removerReferencia()
            carregarFeed()
        } else {
            const e = await resp.json().catch(() => ({}))
            alert(e.detail || t('feed.publishError'))
        }
    } finally {
        btn.disabled = false
    }
}

document.getElementById("postTexto").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.ctrlKey) publicar()
})

// Card de referência dentro de um post: tipo='viagem' mostra os dados ATUAIS
// da viagem (ref_grupo, já lidos ao vivo pela API) com um link pra seção de
// Viagens Públicas existente — nunca uma segunda listagem aqui, só uma porta
// de entrada pra ela. tipo='roteiro' mostra o conteúdo do roteiro (ref_roteiro)
// direto no card, sem precisar navegar pra lugar nenhum.
function montarCardReferencia(p) {
    if (p.tipo === 'viagem' && p.ref_grupo) {
        const g = p.ref_grupo
        const periodo = (g.data_inicio && g.data_fim) ? `${g.data_inicio} → ${g.data_fim}` : ""
        return `
        <p class="post-ref-selo">${t('feed.ref.sharedTrip')}</p>
        <div class="post-ref-card">
            <p class="post-ref-titulo">${escapeHtml(g.nome_grupo)}</p>
            <div class="post-ref-meta">
                ${g.destino_principal ? `<span>${escapeHtml(g.destino_principal)}</span>` : ""}
                ${periodo ? `<span>${periodo}</span>` : ""}
                ${g.limite_participantes != null ? `<span>𓁆𓁇 ${g.vagas_ocupadas}/${g.limite_participantes}</span>` : ""}
            </div>
            <a class="post-ref-btn" href="explorar-viagens.html?id=${g.id_grupo}">${t('feed.ref.viewTrip')}</a>
        </div>`
    }
    if (p.tipo === 'roteiro' && p.ref_roteiro) {
        const r = p.ref_roteiro
        const preview = r.itens.slice(0, 3)
        const resto = r.itens.slice(3)
        const linhaItem = it => `<div class="post-ref-item">• ${escapeHtml(formatarTituloRoteiro(it.titulo))}</div>`
        return `
        <p class="post-ref-selo">📍 ${t('feed.ref.sharedItinerary')}</p>
        <div class="post-ref-card">
            <p class="post-ref-titulo">${t('feed.ref.fullItinerary')}</p>
            <p class="post-ref-sub">${escapeHtml(r.nome_grupo)}${r.destino_principal ? " · " + escapeHtml(r.destino_principal) : ""} · ${r.total_itens} ${t('feed.shareItinerary.items')}</p>
            <div id="roteiro-preview-${p.id_post}">${preview.map(linhaItem).join("")}</div>
            ${resto.length ? `
            <div id="roteiro-resto-${p.id_post}" style="display:none;">${resto.map(linhaItem).join("")}</div>
            <button type="button" class="post-ref-btn" onclick="toggleRoteiroCompleto(${p.id_post})" id="roteiro-btn-${p.id_post}">${t('feed.ref.viewFullItinerary')}</button>
            ` : ""}
        </div>`
    }
    return ""
}

function toggleRoteiroCompleto(idPost) {
    const resto = document.getElementById(`roteiro-resto-${idPost}`)
    const btn = document.getElementById(`roteiro-btn-${idPost}`)
    if (!resto) return
    const aberto = resto.style.display !== "none"
    resto.style.display = aberto ? "none" : "block"
    btn.textContent = aberto ? t('feed.ref.viewFullItinerary') : t('feed.ref.viewLess')
}

async function carregarFeed() {
    const resp = await fetch("/posts", {
        credentials: "include"
    })
    if (!resp.ok) return

    const posts = await resp.json()
    const lista = document.getElementById("feedLista")

    if (posts.length === 0) {
        lista.innerHTML = `<p class="feed-vazio">${t('feed.empty')}</p>`
        return
    }

    lista.innerHTML = posts.map(p => {
        const iniciais = p.nome.trim().split(" ").map(x => x[0]).slice(0, 2).join("").toUpperCase()
        const av = p.foto_perfil
            ? `<div class="av"><img src="${p.foto_perfil}"></div>`
            : `<div class="av">${iniciais}</div>`

        const delBtn = p.id_usuario === meuId
            ? `<button class="btn-del-post" onclick="deletarPost(${p.id_post})">${t('common.delete')}</button>`
            : ""

        const imgHtml = p.imagem
            ? `<img class="post-img" src="${p.imagem}" alt="">`
            : ""

        const jaCurtiu = p.ja_curtiu === 1
        const curtBtn = `<button class="btn-curtir${jaCurtiu ? " curtido" : ""}" onclick="curtir(${p.id_post}, this)">
            <span class="curtir-icon">${jaCurtiu ? "❤️" : "🤍"}</span>
            <span class="curtir-count">${p.curtidas ?? 0}</span>
        </button>`

        const nComents = p.comentarios?.length ?? 0
        const comentHtml = p.comentarios?.length ? p.comentarios.map(c => {
            const ini = (c.nome||"?").trim().split(" ").map(x=>x[0]).slice(0,2).join("").toUpperCase()
            const cAv = c.foto_perfil ? `<img src="${escapeHtml(c.foto_perfil)}" alt="">` : ini
            return `<div class="feed-coment">
                <div class="feed-cav">${cAv}</div>
                <div class="feed-ctxt"><span class="feed-cnome">${escapeHtml(c.nome)}</span> ${escapeHtml(c.conteudo)}</div>
            </div>`
        }).join("") : ""

        return `
        <div class="post-card" id="post-${p.id_post}">
            <div class="post-header">
                ${av}
                <div class="post-meta">
                    <span class="post-autor" onclick="window.location.href='perfil.html?id=${p.id_usuario}'">${escapeHtml(p.nome)}</span>
                    <span class="post-data">${formatarData(p.data_criacao)}</span>
                </div>
                ${delBtn}
            </div>
            ${p.conteudo ? `<p class="post-texto">${escapeHtml(p.conteudo)}</p>` : ''}
            ${imgHtml}
            ${montarCardReferencia(p)}
            <div class="post-acoes">
                ${curtBtn}
                <button class="btn-comentar" onclick="toggleComentarios(${p.id_post})">
                    💬 <span>${nComents}</span>
                </button>
            </div>
            <div class="feed-comentarios" id="coments-${p.id_post}" style="display:none">
                <div class="feed-coments-lista" id="lista-${p.id_post}">${comentHtml}</div>
                <div class="feed-coment-input">
                    <input type="text" id="inputComent-${p.id_post}" placeholder="${t('feed.addComment')}"
                           onkeydown="if(event.key==='Enter'){event.preventDefault();enviarComentario(${p.id_post})}">
                    <button onclick="enviarComentario(${p.id_post})">${t('feed.publish')}</button>
                </div>
            </div>
        </div>`
    }).join("")
}

function deletarPost(id) {
    abrirModalConfirmacao({
        titulo: t('feed.confirmDelete'),
        mensagem: t('feed.confirmDeleteBody'),
        textoConfirmar: t('common.delete'),
        tipo: 'perigo',
        onConfirmar: async () => {
            const resp = await fetch(`/posts/${id}`, {
                method: "DELETE",
                credentials: "include"
            })
            if (resp.ok) document.getElementById(`post-${id}`)?.remove()
        }
    })
}

async function curtir(idPost, btn) {
    btn.disabled = true
    try {
        const resp = await fetch(`/posts/${idPost}/curtir`, { method: "POST", credentials: "include" })
        if (!resp.ok) return
        const data = await resp.json()
        const icon  = btn.querySelector(".curtir-icon")
        const count = btn.querySelector(".curtir-count")
        if (data.curtiu) {
            btn.classList.add("curtido")
            icon.textContent = "❤️"
        } else {
            btn.classList.remove("curtido")
            icon.textContent = "🤍"
        }
        count.textContent = data.total_curtidas
    } finally {
        btn.disabled = false
    }
}

function toggleComentarios(idPost) {
    const el = document.getElementById(`coments-${idPost}`)
    if (!el) return
    const aberto = el.style.display !== "none"
    el.style.display = aberto ? "none" : "block"
    if (!aberto) document.getElementById(`inputComent-${idPost}`)?.focus()
}

async function enviarComentario(idPost) {
    const input = document.getElementById(`inputComent-${idPost}`)
    const texto = input?.value.trim()
    if (!texto) return
    input.disabled = true
    try {
        const resp = await fetch(`/posts/${idPost}/comentar`, {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ conteudo: texto })
        })
        if (!resp.ok) return
        const c = await resp.json()
        const lista = document.getElementById(`lista-${idPost}`)
        const ini = (c.nome||"?").trim().split(" ").map(x=>x[0]).slice(0,2).join("").toUpperCase()
        const cAv = c.foto_perfil ? `<img src="${escapeHtml(c.foto_perfil)}" alt="">` : ini
        lista.insertAdjacentHTML("beforeend", `
            <div class="feed-coment">
                <div class="feed-cav">${cAv}</div>
                <div class="feed-ctxt"><span class="feed-cnome">${escapeHtml(c.nome)}</span> ${escapeHtml(c.conteudo)}</div>
            </div>`)
        const btn = document.querySelector(`#post-${idPost} .btn-comentar span`)
        if (btn) btn.textContent = parseInt(btn.textContent || "0") + 1
        input.value = ""
    } finally {
        input.disabled = false
        input.focus()
    }
}

function formatarData(iso) {
    const d = new Date(iso)
    const agora = new Date()
    const diff = Math.floor((agora - d) / 1000)
    if (diff < 60) return t('feed.date.now')
    if (diff < 3600) return `há ${Math.floor(diff / 60)}${t('feed.date.min')}`
    if (diff < 86400) return `há ${Math.floor(diff / 3600)}${t('feed.date.hour')}`
    if (diff < 604800) return `há ${Math.floor(diff / 86400)}${t('feed.date.days')}`
    return d.toLocaleDateString(getLang())
}

function escapeHtml(txt) {
    return txt.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
}

// "Dia N · horário —" é texto livre dentro de titulo (ver
// backend/alembic/versions/011_roteiro_ordem.py) — removido só da exibição,
// nunca alterado no banco.
function formatarTituloRoteiro(titulo) {
    return (titulo || "").replace(/^dia\s+\d+\s*·\s*\d{1,2}:\d{2}\s*[—\-–]\s*/i, "")
}

carregarMeu()
carregarFeed()
</script>
