services:
  # ── Backend FastAPI ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: diartrip-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - ./backend/.env
    environment:  
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - DB_RETRY_MAX=15
      - DB_RETRY_BASE_WAIT=1.0
      - DB_POOL_SIZE=5
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - /app/venv
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - diartrip-net

  flutter:
    build:
      context: ./diartrip_flutter
      dockerfile: Dockerfile
    container_name: diartrip-flutter
    restart: unless-stopped
    ports:
      - "${FLUTTER_PORT:-7777}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - diartrip-net

  redis:
    image: redis:7-alpine
    container_name: diartrip-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - diartrip-net

volumes:
  mysql_data:
    name: diartrip-mysql-data
  redis_data:
    name: diartrip-redis-data

networks:
  diartrip-net:
    name: diartrip-network
    driver: bridge
